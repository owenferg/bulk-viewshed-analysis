[project]
name = "bulk-gdal-viewshed"
version = "1.1.0"
description = "Cross-platform desktop and command-line bulk GDAL terrain viewshed analysis"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["GDAL", "GIS", "terrain", "viewshed"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
bulk-gdal-viewshed = "bulk_viewshed:main"
bulk-gdal-viewshed-gui = "bulk_viewshed_gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bulk_viewshed", "bulk_viewshed_gui", "gdal_runtime"]
